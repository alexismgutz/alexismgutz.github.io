
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexis Gutierrez | 3D IT Portfolio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d16;color:white;font-family:Arial,sans-serif;overflow-x:hidden}
#scene{position:fixed;inset:0;z-index:0}
#scene canvas{display:block}
.overlay{position:relative;z-index:2;pointer-events:none}
.brand{position:fixed;top:25px;left:30px}
.brand h1{font-size:clamp(19px,3vw,29px);margin:0;letter-spacing:2px}
.brand p{color:#9ab5c9;font-size:12px;letter-spacing:3px}
.map{position:fixed;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:11px;pointer-events:auto}
.map button{background:#101a2bd9;border:1px solid #456078;color:#cbd7e5;padding:10px 14px;border-radius:22px;cursor:pointer;min-width:120px;text-align:left}
.map button:before{content:"●";color:#667a91;margin-right:10px}
.map button.active{border-color:#38d9ff;color:white;box-shadow:0 0 15px #18a8ff66}
.map button.active:before{color:#38d9ff}
.panel{position:fixed;left:5%;bottom:8%;width:min(470px,85vw);background:#09111eea;border:1px solid #36536b;border-radius:18px;padding:25px;pointer-events:auto;box-shadow:0 10px 45px #0008;max-height:65vh;overflow:auto;transition:opacity .35s,transform .35s}
.panel.hide{opacity:0;transform:translateY(25px);pointer-events:none}
body.about-view .panel{width:auto;padding:10px 14px;bottom:5%;left:3%;background:#09111edc}
body.about-view .panel #content{display:none}
body.about-view .panel .back{margin:0}
.panel h2{margin-top:0;color:#72dcff;font-size:27px}
.panel p{color:#c1cbd8;line-height:1.7}
.panel h3{margin-bottom:5px}
.panel a{color:#65d8ff;overflow-wrap:anywhere}
.back{background:#1a3448;color:white;border:1px solid #59bce9;border-radius:20px;padding:11px 18px;cursor:pointer;margin-top:10px}
.hint{position:fixed;top:100px;left:30px;font-size:12px;color:#8da4b8}
@media(max-width:700px){
.brand{top:16px;left:15px}
.hint{top:85px;left:15px}
.map{top:auto;bottom:15px;right:10px;left:10px;transform:none;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:5px}
.map button{min-width:auto;font-size:11px;padding:9px}
.panel{bottom:100px;left:4%;width:92%;max-height:42vh;padding:18px}
}
#musicToggle{position:fixed;right:24px;bottom:20px;z-index:5;pointer-events:auto;background:#101a2be8;color:#d9eaff;border:1px solid #456078;border-radius:24px;padding:12px 17px;cursor:pointer}#musicToggle:hover{border-color:#38d9ff}@media(max-width:700px){#musicToggle{bottom:95px;right:12px;padding:9px 12px}}
</style>
</head>
<body>
<div id="scene"></div>

<div class="overlay">
  <div class="brand">
    <h1>ALEXIS GUTIERREZ</h1>
    <p>IT STUDENT · 3D PORTFOLIO</p>
  </div>
  <div class="hint">Drag to rotate · Scroll to zoom · Select a destination</div>

  <nav class="map">
    <button class="active" onclick="go('home',this)">Home</button>
    <button onclick="go('about',this)">About Me</button>
    <button onclick="go('projects',this)">Projects</button>
    <button onclick="go('skills',this)">Skills</button>
    <button onclick="go('education',this)">Education</button>
    <button onclick="go('contact',this)">Contact</button>
    <button onclick="go('basketball',this)">🏀 Basketball Court</button>
  </nav>
  <button id="musicToggle" type="button" aria-pressed="false">♫ Chill sound: Off</button>

  <div class="panel hide" id="panel">
    <div id="content"></div>
    <button class="back" onclick="go('home')">← Back to Home</button>
  </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

// Gentle original synthesized ambient soundtrack. No external audio files needed.
let audioContext, musicNodes=[], musicOn=false;
const musicButton=document.getElementById('musicToggle');
function startChill(){
 audioContext ||= new (window.AudioContext||window.webkitAudioContext)();
 audioContext.resume();
 const master=audioContext.createGain();master.gain.setValueAtTime(0,audioContext.currentTime);master.gain.linearRampToValueAtTime(.075,audioContext.currentTime+2);master.connect(audioContext.destination);
 const frequencies=[130.81,164.81,196,261.63,329.63];
 frequencies.forEach((f,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=f;gain.gain.value=i<3?.16:.065;osc.connect(gain);gain.connect(master);osc.start();musicNodes.push(osc);});
 musicNodes.push(master);musicOn=true;musicButton.textContent='♫ Chill sound: On';musicButton.setAttribute('aria-pressed','true');
}
function stopChill(){if(!audioContext)return;const master=musicNodes.pop();master.gain.setTargetAtTime(0,audioContext.currentTime,.25);const oscillators=musicNodes.splice(0);oscillators.forEach(o=>o.stop(audioContext.currentTime+1));musicOn=false;musicButton.textContent='♫ Chill sound: Off';musicButton.setAttribute('aria-pressed','false');}
musicButton.addEventListener('click',()=>musicOn?stopChill():startChill());
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080d16);
scene.fog=new THREE.Fog(0x080d16,55,130);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById("scene").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9ccaff,0x172031,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(4,10,5);scene.add(sun);

function box(w,h,d,color,x,y,z,metal=0){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
 new THREE.MeshStandardMaterial({color,roughness:.5,metalness:metal}));
 m.position.set(x,y,z);scene.add(m);return m;
}
function glow(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
 new THREE.MeshBasicMaterial({color}));
 m.position.set(x,y,z);scene.add(m);return m;
}
function label(text,x,y,z){
 const c=document.createElement("canvas");c.width=512;c.height=128;
 const ctx=c.getContext("2d");
 ctx.fillStyle="#081424";ctx.fillRect(0,0,512,128);
 ctx.strokeStyle="#32caff";ctx.lineWidth=5;ctx.strokeRect(3,3,506,122);
 ctx.fillStyle="#ffffff";ctx.font="bold 42px Arial";
 ctx.textAlign="center";ctx.fillText(text,256,78);
 const tex=new THREE.CanvasTexture(c);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(2.5,.625),
 new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
 m.position.set(x,y,z);scene.add(m);
}

// Room
box(28,.25,19,0x202b3b,0,-.15,0);
box(28,7,.2,0x172333,0,3.3,-9.5);
box(.2,7,19,0x142132,-14,3.3,0);
// Right wall removed so the court is visible from the studio.

// Floor lines
for(let x=-12;x<=12;x+=2)box(.015,.01,19,0x344557,x,0,0);
for(let z=-9;z<=9;z+=2)box(28,.01,.015,0x344557,0,0,z);

// Gaming desk
box(6,.2,2.5,0x343b46,0,1.5,-2.8,1);
for(let x of [-2.7,2.7])
 for(let z of [-3.7,-1.9])
 box(.15,1.5,.15,0x14191f,x,.75,z,1);

// Dual monitors: the About Me content appears INSIDE the PC screens.
const normalScreens=[];
for(let x of [-1.25,1.25]){
 box(2.35,1.4,.12,0x05080d,x,2.55,-3.35);
 const bg=glow(2.12,1.16,.02,0x163e70,x,2.55,-3.27);
 normalScreens.push(bg);
 box(.12,.5,.12,0x555e69,x,1.65,-3.35);
 box(.65,.06,.4,0x4c5662,x,1.55,-3.3);
 for(let i=0;i<6;i++){
  const line=glow(.8+(i%3)*.2,.025,.025,i%2?0x28e7c2:0x4aa8ff,
  x-.4,2.92-i*.15,-3.245);
  normalScreens.push(line);
 }
}
function monitorCanvas(){
 const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=560;
 return {canvas,ctx:canvas.getContext('2d')};
}
const leftScreen=monitorCanvas(),rightScreen=monitorCanvas();
function screenPlane(screen,x){
 const texture=new THREE.CanvasTexture(screen.canvas);
 texture.colorSpace=THREE.SRGBColorSpace;
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(2.12,1.16),
   new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide}));
 mesh.position.set(x,2.55,-3.224);mesh.visible=false;scene.add(mesh);
 return {mesh,texture};
}
const aboutLeft=screenPlane(leftScreen,-1.25);
const aboutRight=screenPlane(rightScreen,1.25);
function screenBase(ctx){
 ctx.fillStyle='#091726';ctx.fillRect(0,0,1024,560);
 ctx.fillStyle='#29caff';ctx.fillRect(0,0,1024,9);
}
function drawAboutScreens(photo){
 const a=leftScreen.ctx,b=rightScreen.ctx;
 screenBase(a);screenBase(b);
 a.fillStyle='#83e7ff';a.font='bold 43px Arial';a.fillText('ALEXIS GUTIERREZ',36,65);
 if(photo){
  const scale=Math.max(940/photo.width,405/photo.height);
  const w=photo.width*scale,h=photo.height*scale;
  a.save();a.beginPath();a.rect(34,94,956,425);a.clip();
  a.drawImage(photo,34+(956-w)/2,94+(425-h)/2,w,h);a.restore();
 }else{
  a.fillStyle='#b9d9e8';a.font='32px Arial';a.fillText('Profile photo',40,300);
 }
 b.fillStyle='#eaf6ff';b.font='bold 74px Arial';b.fillText('IT Student',44,94);
 b.fillStyle='#82ddff';b.font='bold 40px Arial';b.fillText('About Me',44,164);
 b.fillStyle='#e5eaf2';b.font='bold 28px Arial';
 const bio=['Hi! I am Alexis, a third-year','BS Information Technology student','at STI College Malolos. I enjoy','exploring technology, learning to','code, and turning creative ideas','into projects. I am still learning','and excited to keep improving.'];
 bio.forEach((t,i)=>b.fillText(t,44,214+i*39));
 b.fillStyle='#ffffff';b.font='bold 39px Arial';b.fillText('20 Years Old',44,520);
 aboutLeft.texture.needsUpdate=true;aboutRight.texture.needsUpdate=true;
}
drawAboutScreens(null);

function courtBox(w,h,d,color,x,y,z,metalness=0){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.75,metalness}));
 mesh.position.set(x,y,z);court.add(mesh);return mesh;
}
function courtLine(points,color=0xf4f7fa,width=.055){
 const path=new THREE.CatmullRomCurve3(points.map(([x,z])=>new THREE.Vector3(x,.055,z)),false,'centripetal');
 const mesh=new THREE.Mesh(new THREE.TubeGeometry(path,Math.max(8,points.length*4),width,5,false),new THREE.MeshBasicMaterial({color}));court.add(mesh);
}
function rectangle(x1,z1,x2,z2,color=0xf4f7fa){courtLine([[x1,z1],[x2,z1],[x2,z2],[x1,z2],[x1,z1]],color);}
function arc(cx,cz,r,a1,a2,color=0xf4f7fa){
 const pts=[];for(let i=0;i<=48;i++){let a=a1+(a2-a1)*i/48;pts.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r]);}courtLine(pts,color,.045);
}
// Compact half-court with one hoop, sized for a personal recreation area.
courtBox(19,.22,17,0x66717b,0,-.14,0);
rectangle(-8.5,-8,8.5,8);
courtLine([[-8.5,7.7],[8.5,7.7]],0xf0cb53,.045);
arc(0,7.7,2.1,Math.PI,Math.PI*2);
rectangle(-2.45,-8,2.45,-2.8);
arc(0,-2.8,1.85,0,Math.PI*2);
arc(0,-6.3,6.15,0,Math.PI);
// Single basketball hoop and backboard at the far end.
courtBox(.42,4.4,.42,0x151a20,0,2.1,-8.35);
courtBox(.35,.28,2.6,0x202932,0,4.1,-7.8);
const board=new THREE.Mesh(new THREE.BoxGeometry(3.7,2.15,.11),new THREE.MeshPhysicalMaterial({color:0xc7e8f3,transparent:true,opacity:.42,roughness:.15,side:THREE.DoubleSide}));
board.position.set(0,4.05,-7.05);court.add(board);
const frame=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(3.7,2.15,.13)),new THREE.LineBasicMaterial({color:0x11171c}));frame.position.copy(board.position);court.add(frame);
const rim=new THREE.Mesh(new THREE.TorusGeometry(.52,.055,9,36),new THREE.MeshStandardMaterial({color:0xc6d0d9,roughness:.35}));
rim.rotation.x=Math.PI/2;rim.position.set(0,3.48,-6.12);court.add(rim);
for(let i=0;i<12;i++){
 const a=i*Math.PI/6,b=(i+1)*Math.PI/6;
 const p1=new THREE.Vector3(Math.cos(a)*.51,3.44,-6.12+Math.sin(a)*.51);
 const p2=new THREE.Vector3(Math.cos(b)*.30,2.72,-6.12+Math.sin(b)*.30);
 court.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1,p2]),new THREE.LineBasicMaterial({color:0xe9f0f2})));
}
// Open court: no enclosing walls, fences or obstructing posts.
// Low-profile ambient floor lights along the far edge only.
for(const x of [-7,0,7]){
 const lamp=new THREE.PointLight(0x4dbbff,2.5,7);
 lamp.position.set(x,2,-7.9);court.add(lamp);
}
const ball=new THREE.Mesh(new THREE.SphereGeometry(.33,20,16),new THREE.MeshStandardMaterial({color:0xd97720,roughness:.75}));
ball.position.set(3.2,.35,5.6);court.add(ball);
// Black basketball seam detailing.
for(const rotation of [0,Math.PI/2]){
 const seam=new THREE.Mesh(new THREE.TorusGeometry(.333,.012,6,64),new THREE.MeshBasicMaterial({color:0x29201b}));
 seam.rotation.y=rotation;ball.add(seam);
}
// Minimal ambient lighting; no plants, lounge chairs, tables, or ball rack.
const ambientCourtLight=new THREE.PointLight(0x55aaff,1.5,12);
ambientCourtLight.position.set(-10,4,3);scene.add(ambientCourtLight);
// A subtle blue accent keeps the gaming area visually balanced.
glow(6,.045,.05,0x1eaeff,0,3.8,-8.9);

// Navigation camera positions
const views = {
  home: {p:[10,9,18], t:[-3,1,-1]},
  about: {p:[0,3.55,0.35], t:[0,2.55,-3.25]},
  projects: {p:[0,4,1], t:[0,3,-7]},
  skills: {p:[5,4,0], t:[7,3,-7]},
  education: {p:[-5,4,-1], t:[-7,2,-7]},
  contact: {p:[5,4,-1], t:[7,2,-7]},
  basketball: {p:[-6,4.2,11], t:[-10,1,3]}
};
let current="home",zoom=1;
const targetPos=new THREE.Vector3(...views.home.p);
const targetLook=new THREE.Vector3(...views.home.t);
const look=targetLook.clone();
camera.position.copy(targetPos);camera.lookAt(look);

const pages={
 about:`<h2>About Me</h2><p>See my photo and introduction on the PC monitors.</p>`,
 projects:`<h2>My Projects</h2><h3>My First 3D Portfolio Website</h3><p>Status: In Progress</p><p>A personal interactive 3D portfolio created using HTML, CSS, JavaScript, and Three.js.</p>`,
 skills:`<h2>My Skills</h2><p>Java — Beginner</p><p>HTML — Beginner</p><p>C# (C-Sharp) — Beginner</p>`,
 education:`<h2>My Education</h2><h3>College (Present)</h3><p>STI College Malolos<br>BS Information Technology<br>3rd Year — Currently Studying</p><h3>Senior High School</h3><p>Calumpit National High School<br>ICT Strand</p><h3>Junior High School</h3><p>Calumpit National High School</p><h3>Elementary</h3><p>Longos Calumpit Elementary School</p>`,
 basketball:`<h2>Basketball Court 🏀</h2><p>Explore my indoor 3D basketball court. Drag to change your view and scroll to zoom. Click Home to return to my portfolio.</p>`,
 contact:`<h2>Contact Me</h2><p>Email: <a href="mailto:alexismgutz@gmail.com">alexismgutz@gmail.com</a></p><p>GitHub: <a href="https://github.com/alexismgutz" target="_blank" rel="noopener noreferrer">My GitHub Profile</a></p>`
};

window.go=function(id,btn){
 current=id;zoom=1;
  offsetX=0;offsetY=0;
  setAboutScreens(id==="about");
  document.body.classList.toggle("about-view",id==="about");
 targetPos.set(...views[id].p);
 targetLook.set(...views[id].t);
 document.querySelectorAll(".map button").forEach(b=>b.classList.remove("active"));
 const selected=btn||[...document.querySelectorAll(".map button")].find(b=>b.textContent.trim().toLowerCase()==id || (id==="basketball"&&b.textContent.includes("Basketball")) || (id==="about"&&b.textContent.trim()==="About Me"));
 if(selected)selected.classList.add("active");
 const panel=document.getElementById("panel");
 if(id==="home")panel.classList.add("hide");
 else{
  document.getElementById("content").innerHTML=pages[id];
  panel.classList.remove("hide");
 }
};

// Drag camera slightly
let dragging=false,lastX=0,lastY=0,offsetX=0,offsetY=0;
renderer.domElement.addEventListener("pointerdown",e=>{
 dragging=true;lastX=e.clientX;lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointerup",()=>dragging=false);
renderer.domElement.addEventListener("pointermove",e=>{
 if(!dragging)return;
 offsetX+=(e.clientX-lastX)*.008;
 offsetY+=(e.clientY-lastY)*.005;
 offsetY=Math.max(-1,Math.min(1,offsetY));
 lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener("wheel",e=>{
 e.preventDefault();zoom=Math.max(.65,Math.min(1.5,zoom+e.deltaY*.001));
},{passive:false});

function animate(){
 requestAnimationFrame(animate);
 const desired=targetPos.clone().multiplyScalar(zoom);
 desired.x+=offsetX;desired.y+=offsetY;
 camera.position.lerp(desired,.045);
 look.lerp(targetLook,.045);
 camera.lookAt(look);
 renderer.render(scene,camera);
}
animate();
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
